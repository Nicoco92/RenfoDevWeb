<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chatbot – Festival SonoRive</title>
    <style>
      :root {
        --bg: #0f0d1c;
        --panel: #1a1730;
        --accent: #ff4d8d;
        --accent2: #7c5cff;
        --text: #f3f0ff;
        --muted: #a89fd0;
        --bubble-bot: #262148;
        --bubble-user: linear-gradient(135deg, #ff4d8d, #7c5cff);
        font-family: "Segoe UI", Inter, system-ui, sans-serif;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background: radial-gradient(1200px 600px at 20% -10%, #2b1e5c 0%, var(--bg) 60%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }
      .app {
        width: 100%;
        max-width: 520px;
        height: 90vh;
        max-height: 760px;
        background: var(--panel);
        border-radius: 20px;
        box-shadow: 0 25px 60px rgba(0,0,0,.5);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 1px solid #2e2857;
      }
      header {
        padding: 18px 20px;
        background: linear-gradient(120deg, #ff4d8d22, #7c5cff22);
        border-bottom: 1px solid #2e2857;
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .logo {
        width: 46px; height: 46px; border-radius: 50%;
        background: conic-gradient(from 20deg, var(--accent), var(--accent2), var(--accent));
        display: flex; align-items: center; justify-content: center;
        font-size: 24px;
      }
      h1 { font-size: 1.05rem; font-weight: 600; }
      .status { font-size: .75rem; color: #7ef0b0; display: flex; align-items: center; gap: 6px; }
      .dot { width: 8px; height: 8px; background: #7ef0b0; border-radius: 50%; display: inline-block; }
      #chat {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      #chat::-webkit-scrollbar { width: 6px; }
      #chat::-webkit-scrollbar-thumb { background: #3a3470; border-radius: 3px; }
      .msg {
        max-width: 82%;
        padding: 11px 15px;
        border-radius: 16px;
        font-size: .92rem;
        line-height: 1.5;
        animation: pop .25s ease;
        white-space: pre-line;
      }
      @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; } }
      .bot { align-self: flex-start; background: var(--bubble-bot); border-bottom-left-radius: 4px; }
      .user { align-self: flex-end; background: var(--bubble-user); border-bottom-right-radius: 4px; }
      .typing { align-self: flex-start; display: flex; gap: 5px; padding: 14px 16px; background: var(--bubble-bot); border-radius: 16px; }
      .typing i { width: 7px; height: 7px; background: var(--muted); border-radius: 50%; animation: blink 1.2s infinite; }
      .typing i:nth-child(2) { animation-delay: .2s; }
      .typing i:nth-child(3) { animation-delay: .4s; }
      @keyframes blink { 0%,80%,100% { opacity: .25; } 40% { opacity: 1; } }
      #quick {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 20px 10px;
      }
      .chip {
        border: 1px solid #4a4190;
        background: transparent;
        color: var(--text);
        font-size: .8rem;
        padding: 7px 13px;
        border-radius: 999px;
        cursor: pointer;
        transition: .2s;
        font-family: inherit;
      }
      .chip:hover { background: #ff4d8d33; border-color: var(--accent); }
      form {
        display: flex;
        gap: 10px;
        padding: 14px 16px;
        border-top: 1px solid #2e2857;
        background: #151227;
      }
      input {
        flex: 1;
        background: #262148;
        border: 1px solid #3a3470;
        color: var(--text);
        border-radius: 999px;
        padding: 12px 18px;
        font-size: .92rem;
        outline: none;
        font-family: inherit;
      }
      input:focus { border-color: var(--accent2); }
      button.send {
        border: none;
        width: 46px; height: 46px;
        border-radius: 50%;
        background: var(--bubble-user);
        color: white;
        font-size: 1.1rem;
        cursor: pointer;
        transition: transform .15s;
      }
      button.send:hover { transform: scale(1.08); }
      .hint { text-align: center; font-size: .72rem; color: var(--muted); padding-bottom: 10px; }
      #clear {
        margin-left: auto;
        border: 1px solid #4a4190;
        background: transparent;
        color: var(--muted);
        font-size: .75rem;
        padding: 7px 13px;
        border-radius: 999px;
        cursor: pointer;
        transition: .2s;
        font-family: inherit;
      }
      #clear:hover { background: #ff4d8d33; border-color: var(--accent); color: var(--text); }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <div class="logo">🎵</div>
        <div>
          <h1>SonoRive&nbsp;Bot</h1>
          <div class="status"><span class="dot"></span> En ligne – Festival SonoRive 2026</div>
        </div>
        <button id="clear" title="Vider la conversation">🗑️ Effacer</button>
      </header>
      <div id="chat"></div>
      <div id="quick"></div>
      <form id="form">
        <input id="input" type="text" placeholder="Pose ta question sur le festival…" autocomplete="off" />
        <button class="send" type="submit" aria-label="Envoyer">➤</button>
      </form>
      <div class="hint">Bot 100% local, sans connexion — réponses basées sur des règles</div>
    </div>

    <script>
      const chat = document.getElementById("chat");
      const form = document.getElementById("form");
      const input = document.getElementById("input");
      const quick = document.getElementById("quick");

      const FEST = {
        nom: "Festival SonoRive",
        dates: "du 17 au 19 juillet 2026",
        lieu: "Parc des Rives, Lyon (France)",
        prix: "Pass 1 jour : 49 € · Pass 3 jours : 119 € · Camping : 35 € (3 nuits)",
        horaires: "Portes ouvertes de 11h à 2h du matin ; concerts de 14h à 1h30.",
        age: "Le festival est accessible à tous. Accompagnement obligatoire pour les moins de 12 ans. Zone bars réservée aux 18+ sur justificatif.",
        programmation: [
          "Vendredi : DJ Snake, Aya Nakamura, Vitalic",
          "Samedi : Phoenix, Angèle, Justice, Kavinsky",
          "Dimanche : -M-, Clara Luciani, Ibeyi, Nouvelle Vague"
        ].join("\n"),
        transports: "Navettes gratuites depuis la gare toutes les 20 min (11h–2h). Parking à 10 €/jour. P+R conseillés.",
        accessoires: "Interdits : bouteilles en verre, parapluies, drones, verre dur. Autorisés : gourde vide, crème solaire, petit sac (<20L).",
        meteo: "Prévisions : 24–29°C, orages possibles samedi soir. Ponchos vendus sur place (3 €).",
        billets: "Billetterie en ligne jusqu'au 16 juillet minuit, puis guichet sur site selon disponibilités.",
        contact: "contact@sonorive.fr · 04 78 00 00 00 · accueil festival à l'entrée principale.",
        accessible: "Scène principale sur plateau surélevé, boucle magnétique, zones PMR avec accompagnateur gratuit.",
        benevoles: "300 bénévoles recherchés : 2 slots de 6h = pass 3 jours offert. Inscription sur place ou par mail."
      };

      const RULES = [
        { k: ["bonjour","salut","hello","coucou","hey","yo"], r: () => "Salut ! 🎶 Bienvenue au " + FEST.nom + " ! Je peux te renseigner sur la programmation, les billets, l'accès, l'hébergement… Que veux-tu savoir ?" },
        { k: ["date","quand","jour","semaine","calendrier"], r: () => "Le festival a lieu " + FEST.dates + " 🗓️" },
        { k: ["lieu","où","adresse","site","situer","ville"], r: () => "Le festival se déroule au " + FEST.lieu + " 📍" },
        { k: ["prix","tarif","coût","combien","ticket","billet","pass","payer"], r: () => "🎟️ Tarifs :\n" + FEST.prix },
        { k: ["achat","acheter","réserver","commander","boutique","point de vente","billetterie"], r: () => FEST.billets },
        { k: ["programmation","line","lineup","affiche","artiste","groupe","concert","scene","scène","joue","passage"], r: () => "🎤 Programmation 2026 :\n" + FEST.programmation },
        { k: ["horaire","heure","ouvre","ouverture","fermeture"], r: () => "⏰ " + FEST.horaires },
        { k: ["age","âge","enfant","mineur","jeune","famille"], r: () => "👨‍👩‍👧 " + FEST.age },
        { k: ["acces","accès","transport","train","voiture","parking","garer","bus","navette","aller"], r: () => "🚌 " + FEST.transports },
        { k: ["interdit","autorisé","autorise","sac","bagage","gamelle","verre","securité","sécurité","fouille","apporter","caméra"], r: () => "🎒 " + FEST.accessoires },
        { k: ["meteo","météo","pluie","soleil","chaud","temperature","température"], r: () => "☀️ " + FEST.meteo },
        { k: ["contact","mail","email","telephone","téléphone","joindre","telephone","numero"], r: () => "📮 " + FEST.contact },
        { k: ["pmr","handicap","accessible","fauteuil","moteur","mobilite","mobilité"], r: () => "♿ " + FEST.accessible },
        { k: ["benevol","bénévol","volontaire","aide","staff"], r: () => "🙌 " + FEST.benevoles },
        { k: ["dormir","hebergement","hébergement","camping","hotel","hôtel","nuit","loger"], r: () => "Camping sur place : 35 € pour 3 nuits (sanitaires, douches chaudes, espace restauration 24h/24). Hôtels partenaires à 15 min en navette avec code SONORIVE20 (-20%)." },
        { k: ["manger","boire","restaur","food","vegetarien","végétarien","vegan","gluten"], r: () => "🍔 40 stands de food trucks : options végétariennes, veganes et sans gluten partout, affichage allergènes obligatoire. Menus de 8 à 14 €." },
        { k: ["merci","thanks","super","cool","genial","génial","top","parfait"], r: () => "Avec plaisir ! 🎉 N'hésite pas si tu as d'autres questions. Vive SonoRive ! 🎶" },
        { k: ["au revoir","bye","ciao","a\+","bonne nuit"], r: () => "À bientôt ! 🎵 Amuse-toi bien au festival !" }
      ];

      const FALLBACK = "Hmm, je ne suis pas sûr de comprendre 😅 Essaie des mots-clés comme « billets », « programmation », « accès », « camping »… ou tape « aide ».";

      const CHIPS = ["🎟️ Billets", "🎤 Programmation", "📍 Lieu & accès", "⛺ Camping", "🎒 Interdit/autorisé", "🌍 Accessibilité"];

      function addMsg(text, who) {
        const d = document.createElement("div");
        d.className = "msg " + who;
        d.textContent = text;
        chat.appendChild(d);
        chat.scrollTop = chat.scrollHeight;
      }

      function showTyping() {
        const t = document.createElement("div");
        t.className = "typing";
        t.id = "typing";
        t.innerHTML = "<i></i><i></i><i></i>";
        chat.appendChild(t);
        chat.scrollTop = chat.scrollHeight;
      }
      function hideTyping() {
        const t = document.getElementById("typing");
        if (t) t.remove();
      }

      function answer(q) {
        const s = q.toLowerCase();
        if (/aide|help|menu|quoi|que peux/.test(s)) {
          return "Voici ce que je sais faire 👇\n• Dates, lieu & horaires\n• Programmation complète\n• Billets & tarifs\n• Accès & transports\n• Camping & hébergement\n• Objets autorisés/interdits\n• Météo, food, accessibilité, bénévolat…";
        }
        for (const rule of RULES) {
          if (rule.k.some(kw => s.includes(kw))) return rule.r();
        }
        return FALLBACK;
      }

      function respond(q) {
        showTyping();
        setTimeout(() => {
          hideTyping();
          addMsg(answer(q), "bot");
        }, 500 + Math.random() * 500);
      }

      function send(text) {
        addMsg(text, "user");
        respond(text);
      }

      form.addEventListener("submit", e => {
        e.preventDefault();
        const v = input.value.trim();
        if (!v) return;
        input.value = "";
        send(v);
      });

      CHIPS.forEach(c => {
        const b = document.createElement("button");
        b.className = "chip";
        b.textContent = c;
        b.onclick = () => send(c.replace(/^[^\wÀ-ÿ]+/, ""));
        quick.appendChild(b);
      });

      function welcome() {
        addMsg("Hey ! 👋 Je suis le bot du " + FEST.nom + " " + FEST.dates + " !\nDemande-moi tout : billets, prog, accès, camping… Tape « aide » pour voir tout ce que je sais.", "bot");
      }

      document.getElementById("clear").addEventListener("click", () => {
        chat.innerHTML = "";
        welcome();
      });

      welcome();
    </script>
  </body>
</html>
