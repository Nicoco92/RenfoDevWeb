<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SUNBLAST Festival — Assistant Festivalier</title>
    <style>
        :root {
            --bg: #0d0a1f;
            --bg-2: #16123a;
            --panel: rgba(22, 18, 58, .85);
            --accent: #ff2e88;
            --accent-2: #ffb020;
            --violet: #7c4dff;
            --cyan: #22e4ff;
            --text: #f4f2ff;
            --muted: #b8b2d9;
            --radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background:
                radial-gradient(1200px 600px at 15% -10%, rgba(124, 77, 255, .45), transparent 60%),
                radial-gradient(900px 500px at 110% 15%, rgba(255, 46, 136, .35), transparent 55%),
                radial-gradient(700px 500px at 50% 120%, rgba(34, 228, 255, .22), transparent 60%),
                var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            min-height: 100vh;
        }

        /* ===== Chat frame ===== */
        .app {
            width: 100%;
            max-width: 460px;
            height: min(760px, 92vh);
            background: var(--panel);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, .12);
            border-radius: 26px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ===== Header ===== */
        header {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            gap: 14px;
            border-bottom: 1px solid rgba(255, 255, 255, .10);
            background: linear-gradient(120deg, rgba(255, 46, 136, .25), rgba(124, 77, 255, .25));
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            display: grid;
            place-items: center;
            font-size: 22px;
            box-shadow: 0 6px 18px rgba(255, 46, 136, .45);
            flex-shrink: 0;
        }

        .head-txt {
            flex: 1;
            min-width: 0;
        }

        .head-txt h1 {
            font-size: 17px;
            letter-spacing: .5px;
            font-weight: 800;
        }

        .head-txt h1 span {
            color: var(--accent-2);
        }

        .status {
            font-size: 12px;
            color: var(--muted);
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 3px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3ddc84;
            box-shadow: 0 0 8px #3ddc84;
        }

        .band {
            height: 4px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2), var(--cyan), var(--violet));
        }

        /* ===== Messages ===== */
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 20px 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            scroll-behavior: smooth;
        }

        #chat::-webkit-scrollbar {
            width: 6px;
        }

        #chat::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, .18);
            border-radius: 3px;
        }

        .msg {
            max-width: 82%;
            padding: 12px 15px;
            font-size: 14.5px;
            line-height: 1.55;
            animation: pop .25s ease;
        }

        @keyframes pop {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
            }
        }

        .bot {
            align-self: flex-start;
            background: rgba(255, 255, 255, .08);
            border: 1px solid rgba(255, 255, 255, .09);
            border-radius: 4px 18px 18px 18px;
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(135deg, var(--violet), var(--accent));
            border-radius: 18px 4px 18px 18px;
            box-shadow: 0 6px 20px rgba(124, 77, 255, .35);
        }

        .msg b {
            color: var(--accent-2);
        }

        .msg ul {
            margin: 6px 0 2px 18px;
        }

        /* typing indicator */
        .typing {
            align-self: flex-start;
            display: flex;
            gap: 5px;
            padding: 14px 16px;
            background: rgba(255, 255, 255, .08);
            border-radius: 4px 18px 18px 18px;
        }

        .typing i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            animation: blink 1.2s infinite;
        }

        .typing i:nth-child(2) {
            animation-delay: .2s;
        }

        .typing i:nth-child(3) {
            animation-delay: .4s;
        }

        @keyframes blink {

            0%,
            80%,
            100% {
                opacity: .25;
                transform: translateY(0);
            }

            40% {
                opacity: 1;
                transform: translateY(-3px);
            }
        }

        /* ===== Quick replies ===== */
        #quick {
            display: flex;
            gap: 8px;
            padding: 10px 14px 4px;
            flex-wrap: wrap;
        }

        .chip {
            font-size: 12.5px;
            font-weight: 600;
            color: var(--text);
            background: transparent;
            border: 1px solid rgba(255, 176, 32, .55);
            border-radius: 999px;
            padding: 7px 13px;
            cursor: pointer;
            transition: .2s;
        }

        .chip:hover {
            background: rgba(255, 176, 32, .18);
            transform: translateY(-1px);
        }

        /* ===== Input ===== */
        form {
            display: flex;
            gap: 10px;
            padding: 12px 14px 16px;
        }

        #input {
            flex: 1;
            background: rgba(255, 255, 255, .07);
            border: 1px solid rgba(255, 255, 255, .14);
            color: var(--text);
            border-radius: 999px;
            padding: 13px 18px;
            font-size: 14px;
            outline: none;
            transition: .2s;
        }

        #input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(255, 46, 136, .2);
        }

        #input::placeholder {
            color: #7d76a8;
        }

        #send {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: #1a0d21;
            font-size: 18px;
            cursor: pointer;
            transition: .2s;
            display: grid;
            place-items: center;
        }

        #send:hover {
            transform: scale(1.07);
            box-shadow: 0 6px 20px rgba(255, 46, 136, .5);
        }

        @media (max-width: 480px) {
            .app {
                max-width: 100%;
                height: 100vh;
                border-radius: 0;
            }

            body {
                padding: 0;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <div class="logo">🎧</div>
            <div class="head-txt">
                <h1>SUNBLAST <span>Assist</span></h1>
                <div class="status"><span class="dot"></span> En ligne — 24/7 pendant le festival</div>
            </div>
        </header>
        <div class="band"></div>
        <div id="chat"></div>
        <div id="quick"></div>
        <form id="form" autocomplete="off">
            <input id="input" placeholder="Pose ta question à l'assistant…" />
            <button id="send" type="submit" aria-label="Envoyer">➤</button>
        </form>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const quick = document.getElementById('quick');

        /* ============ Base de connaissances du bot ============ */
        const RULES = [
            {
                k: ['billet', 'ticket', 'place', 'tarif', 'prix', 'pass', 'acheter'], a:
                    `🎫 <b>Billetterie</b><br>• Pass 1 jour : <b>59 €</b><br>• Pass 3 jours : <b>149 €</b> (place limitée !)<br>• VIP : <b>249 €</b> (zone premium + bar dédié)<br>Retrait des bracelets au Village d'accueil, dès 10h.`
            },
            {
                k: ['horaire', 'heure', 'ouvre', 'ouverture', 'ferme', 'programme', 'planning', 'ligneup', 'line', 'scene', 'scène', 'concert'], a:
                    `📅 <b>Programme</b><br>• Jeu. : ouverture des portes à 16h — soirée électro<br>• Ven. : 12h → 2h — rock & indie<br>• Sam. : 12h → 4h — têtes d'affiche + DJ set final<br>Le programme détaillé est dispo dans l'app du festival !`
            },
            {
                k: ['acces', 'accès', 'aller', 'venir', 'transport', 'parking', 'gare', 'train', 'bus', 'voiture'], a:
                    `🚌 <b>Accès</b><br>• Navettes gratuites depuis la gare toutes les 15 min<br>• Parking P1 & P2 : 10 €/jour, navette incluse<br>• Covoiturage : zone dédiée près de l'entrée est<br>Pensez au billet de train combiné -20% !`
            },
            {
                k: ['camping', 'dormir', 'nuit', 'hotel', 'hébergement', 'hebergement', 'tente'], a:
                    `⛺ <b>Se loger</b><br>• Camping festivalier : 25 €/pers. pour 3 nuits (douches + chargeurs)<br>• Eco-cabanes : dès 40 €/nuit<br>• Liste d'hôtels partenaires sur le site, avec code <b>SUN20</b> = -20%`
            },
            {
                k: ['manger', 'boire', 'food', 'resto', 'restaurant', 'bar', 'vegetarien', 'végétarien', 'vegan', 'eau'], a:
                    `🌮 <b>Food & Boissons</b><br>• Plus de 20 food trucks (vegan, sans gluten, local)<br>• Gourdes gratuites : 4 fontaines à eau sur site<br>• Bières locales, cocktails & mocktails<br>Paiement sans contact accepté partout !`
            },
            {
                k: ['interdit', 'bagage', 'sac', 'securite', 'sécurité', 'objet', 'couteau', 'cigarette', 'alcool', 'drogue'], a:
                    `🛡️ <b>Sécurité & interdits</b><br>Interdits : bouteilles en verre, objets tranchants, parapluies, drones, extérieur boissons.<br>Autorisés : gourde vide ≤ 1L, crème solaire (format poche), powerbank.<br>Fouilles à l'entrée, soyez sympa avec l'équipe !`
            },
            {
                k: ['meteo', 'météo', 'pluie', 'soleil', 'temperature', 'température', 'froid'], a:
                    `☀️ <b>Météo du week-end</b><br>Prévu : 24–28°C, ciel dégagé (probabilité de pluie < 10%).<br>Conseils : chapeau, crème solaire et gourde — le soleil tape fort sur la plaine !`
            },
            {
                k: ['enfant', 'enfant', 'famille', 'mineur', 'age', 'âge'], a:
                    `👶 <b>Familles</b><br>Gratuit pour les moins de 12 ans (accompagnés). Espace famille avec jeux, siestes et snacks au Village. L'accès aux scènes après 22h est réservé aux 16+.`
            },
            {
                k: ['pmr', 'handicap', 'accessibilite', 'accessibilité', 'fauteuil'], a:
                    `♿ <b>Accessibilité</b><br>Plateformes PMR devant chaque scène, sanitaires adaptés, navettes accessible fauteuils roulants. Accompagnant : entrée gratuite. Écrivez à accessibilite@sunblast.fr avant le festival.`
            },
            {
                k: ['objet', 'perdu', 'perte', 'trouve', 'retrouve', 'perdu?'], a:
                    `🔦 <b>Objets trouvés</b><br>Rendez-vous au stand Info Point près de l'entrée principale, ouvert de 10h à 2h. Après le festival : objets conservés 30 jours — liste publiée sur notre site.`
            },
            {
                k: ['merci', 'thanks', 'cool', 'top', 'genial', 'génial'], a:
                    `Avec plaisir ! 🎉 Profite bien, hydrate-toi, et danse comme si le soleil ne devait jamais se coucher. SUNBLAST c'est QUE du bonheur ! ☀️🎶`
            },
            {
                k: ['salut', 'bonjour', 'hello', 'hey', 'coucou', 'yo', 'wesh', 'hello?', 'bonsoir'], a:
                    `Salut festivalier·ère ! 👋 Bienvenue sur <b>SUNBLAST Assist</b>, ton copilote du festival. Programmes, billets, accès, food… pose ta question, je gère ! 🎪`
            },
        ];

        const FALLBACK = `Hmm, je n'ai pas tout capté 🤔 Essaie avec des mots-clés comme <b>billets</b>, <b>programme</b>, <b>accès</b>, <b>camping</b> ou <b>food</b> — ou tape "aide" !`;
        const HELP = `Voici ce que je sais faire :<ul><li>🎫 Billetterie & tarifs</li><li>📅 Programme & horaires</li><li>🚌 Accès, parking, navettes</li><li>⛺ Camping & hébergements</li><li>🌮 Food & boissons</li><li>🛡️ Sécurité & interdits</li><li>☀️ Météo, ♿ accessibilité, objets trouvés…</li></ul>`;

        const CHIPS = ['Programme', 'Billets', 'Accès', 'Camping', 'Food', 'Sécurité'];

        /* ============ Moteur ============ */
        function addMsg(html, who) {
            const d = document.createElement('div');
            d.className = 'msg ' + who;
            d.innerHTML = html;
            chat.appendChild(d);
            chat.scrollTop = chat.scrollHeight;
        }

        function botReply(q) {
            const t = q.toLowerCase();
            const rule = RULES.find(r => r.k.some(k => t.includes(k)));
            return rule ? rule.a : (t.includes('aide') || t.includes('help') ? HELP : FALLBACK);
        }

        function send(q) {
            if (!q.trim()) return;
            addMsg(q.replace(/</g, '&lt;'), 'user');
            input.value = '';
            quick.style.display = 'none';
            const typ = document.createElement('div');
            typ.className = 'typing';
            typ.innerHTML = '<i></i><i></i><i></i>';
            chat.appendChild(typ);
            chat.scrollTop = chat.scrollHeight;
            setTimeout(() => {
                typ.remove();
                addMsg(botReply(q), 'bot');
                quick.style.display = 'flex';
            }, 600 + Math.random() * 500);
        }

        form.addEventListener('submit', e => { e.preventDefault(); send(input.value); });

        CHIPS.forEach(c => {
            const b = document.createElement('button');
            b.type = 'button';
            b.className = 'chip';
            b.textContent = c;
            b.onclick = () => send(c);
            quick.appendChild(b);
        });

        addMsg(`Hey ! 👋 Bienvenue au <b>SUNBLAST Festival</b> ☀️ Je suis ton assistant festivalier : pose-moi une question ou choisis une suggestion ci-dessous !`, 'bot');
    </script>
</body>

</html>
