<!doctype html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLSTICE Festival – Assistant des festivaliers</title>
    <style>
        :root {
            --bg: #0d0a1a;
            --panel: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.12);
            --text: #f4f1ff;
            --muted: #a89fc9;
            --pink: #ff3d81;
            --purple: #8b5cf6;
            --cyan: #22d3ee;
            --grad: linear-gradient(135deg, var(--pink), var(--purple) 55%, var(--cyan));
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            padding: 20px;
            background-image:
                radial-gradient(ellipse 80% 50% at 10% -10%, rgba(139, 92, 246, 0.25), transparent),
                radial-gradient(ellipse 60% 40% at 100% 0%, rgba(255, 61, 129, 0.18), transparent),
                radial-gradient(ellipse 70% 50% at 50% 110%, rgba(34, 211, 238, 0.12), transparent);
        }

        .app {
            width: 100%;
            max-width: 520px;
            height: 100%;
            max-height: 860px;
            display: flex;
            flex-direction: column;
            background: rgba(13, 10, 26, 0.7);
            border: 1px solid var(--border);
            border-radius: 24px;
            overflow: hidden;
            backdrop-filter: blur(20px);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
        }

        header {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 18px 22px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            width: 46px;
            height: 46px;
            border-radius: 14px;
            background: var(--grad);
            display: grid;
            place-items: center;
            font-weight: 800;
            font-size: 20px;
            color: #fff;
            letter-spacing: -1px;
            flex-shrink: 0;
            box-shadow: 0 6px 20px rgba(255, 61, 129, 0.45);
        }

        .brand h1 {
            font-size: 17px;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .brand h1 span {
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .brand p {
            font-size: 12px;
            color: var(--muted);
            margin-top: 2px;
        }

        .status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            color: var(--muted);
        }

        .dot {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #34d399;
            box-shadow: 0 0 10px #34d399;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            50% {
                opacity: 0.4;
            }
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 22px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .chat::-webkit-scrollbar {
            width: 6px;
        }

        .chat::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 3px;
        }

        .msg {
            display: flex;
            gap: 10px;
            max-width: 85%;
            animation: rise 0.25s ease;
        }

        @keyframes rise {
            from {
                opacity: 0;
                transform: translateY(8px);
            }
        }

        .msg.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 50%;
            flex-shrink: 0;
            display: grid;
            place-items: center;
            font-size: 15px;
        }

        .msg.bot .avatar {
            background: var(--grad);
        }

        .msg.user .avatar {
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid var(--border);
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.55;
            white-space: pre-line;
        }

        .msg.bot .bubble {
            background: var(--panel);
            border: 1px solid var(--border);
            border-top-left-radius: 6px;
        }

        .msg.user .bubble {
            background: linear-gradient(135deg, #a13eea, #7c3aed);
            border-top-right-radius: 6px;
            box-shadow: 0 6px 18px rgba(124, 58, 237, 0.35);
        }

        .bubble b {
            color: var(--cyan);
        }

        .bubble em {
            color: #ffb0cf;
            font-style: normal;
            font-weight: 600;
        }

        .bubble ul {
            margin: 6px 0 0 18px;
        }

        .quick {
            display: flex;
            gap: 8px;
            padding: 0 22px 14px;
            flex-wrap: wrap;
        }

        .chip {
            padding: 8px 14px;
            font-size: 12.5px;
            border-radius: 999px;
            border: 1px solid rgba(139, 92, 246, 0.5);
            background: rgba(139, 92, 246, 0.12);
            color: #d9ccff;
            cursor: pointer;
            transition: 0.2s;
            font-family: inherit;
        }

        .chip:hover {
            background: rgba(139, 92, 246, 0.3);
            transform: translateY(-1px);
        }

        form {
            display: flex;
            gap: 10px;
            padding: 16px 22px 20px;
            border-top: 1px solid var(--border);
        }

        input {
            flex: 1;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 13px 16px;
            color: var(--text);
            font-size: 14px;
            outline: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: var(--purple);
        }

        input::placeholder {
            color: var(--muted);
        }

        button.send {
            width: 48px;
            border: none;
            border-radius: 14px;
            background: var(--grad);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            transition: 0.2s;
            flex-shrink: 0;
        }

        button.send:hover {
            transform: scale(1.06);
        }

        .typing {
            display: flex;
            gap: 5px;
            align-items: center;
            padding: 4px 2px;
        }

        .typing i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--muted);
            animation: blink 1s infinite;
        }

        .typing i:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing i:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes blink {
            50% {
                opacity: 0.25;
                transform: translateY(-3px);
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 0;
            }

            .app {
                max-height: none;
                height: 100dvh;
                border-radius: 0;
            }
        }
    </style>
</head>

<body>
    <div class="app">
        <header>
            <div class="logo">S</div>
            <div class="brand">
                <h1>SOLSTICE <span>FESTIVAL</span></h1>
                <p>Assistant des festivaliers · 24/7</p>
            </div>
            <div class="status"><span class="dot"></span>En ligne</div>
        </header>

        <div class="chat" id="chat"></div>
        <div class="quick" id="quick"></div>

        <form id="form" autocomplete="off">
            <input id="input" type="text" placeholder="Pose ta question au festival…" />
            <button class="send" type="submit" aria-label="Envoyer">➤</button>
        </form>
    </div>

    <script>
        const FEST = {
            nom: "SOLSTICE Festival",
            dates: "du 12 au 14 juin 2026",
            lieu: "Parc des Étoiles, Lyon",
            horaires: "ouvertures des portes de 12h à 2h du matin",
            billets: "Pass 1 jour à 79€, Pass 3 jours à 189€, VIP à 349€ (zone dédiée, bars privés, vue scène principale). Billetterie sur solstice-festival.fr — attention aux revendeurs non officiels !",
            camping: "Camping inclus avec le Pass 3 jours : douches chaudes, espaces ombragés, recharge de téléphone gratuite. Ouverture du camping la veille, 11 juin, à partir de 14h.",
            actif: "à 12 € en prévente ou 15 € sur place, remboursable à la sortie du festival",
            interdits: "extincteurs, parapluies, bouteilles en verre, drones, stickers et marqueurs"
        };

        const REPLY = (t) => t;
        const INTENTS = [
            {
                k: ["billet", "tarif", "prix", "ticket", "pass", "vip", "acheter", "payer", "coût", "cout"],
                a: `🎟️ Voici nos billets pour le ${FEST.dates} :\n\n• <b>Pass 1 jour</b> — 79 €\n• <b>Pass 3 jours</b> — 189 €\n• <b>Pass VIP</b> — 349 € (zone dédiée, bars privés, vue scène principale)\n\nTout se passe sur <em>solstice-festival.fr</em>. Méfie-toi des revendeurs non officiels : seuls les billets achetés sur notre site ou nos partenaires sont valables. Le paiement en 3× sans frais est possible dès 100 €.`
            },
            {
                k: ["horaire", "heure", "ouverture", "porte", "fermeture", "commence", "fin"],
                a: `⏰ Les portes ouvrent <b>chaque jour de 12h à 2h du matin</b>, du 12 au 14 juin.\n\nLes premiers concerts démarrent à 13h sur les scènes secondaires, et la tête d'affiche monte sur la Main Stage vers 22h30. Le re-entry est possible jusqu'à 20h avec ton bracelet.`
            },
            {
                k: ["accès", "arriver", "transport", "train", "bus", "voiture", "parking", "métro", "metro", "navette", "gare"],
                a: `🚍 Pour rejoindre le Parc des Étoiles à Lyon :\n\n• <b>Navettes gratuites</b> depuis la gare Part-Dieu toutes les 20 min (12h–2h)\n• <b>Métro</b> ligne D + 10 min de marche\n• <b>Parking</b> relais à 10 € / jour, avec navette directe\n• <b>À vélo</b> : parkings vélos sécurisés gratuits à chaque entrée\n\nOn conseille vivement les transports en commun : la circulation est limitée autour du site.`
            },
            {
                k: ["camping", "dormir", "nuit", "tente", "hotel", "hébergement", "hebergement"],
                a: `⛺ Le camping est <b>inclus avec le Pass 3 jours</b> !\n\n• Ouverture la veille, <b>11 juin dès 14h</b>\n• Douches chaudes et sanitaires partout\n• Espaces ombragés + zones calmes après 2h\n• Recharge de téléphone gratuite\n\nEnvie de confort ? Nos partenaires Hôtel Aurora et Auberge du Parc proposent −15 % avec le code <em>SOLSTICE26</em>.`
            },
            {
                k: ["interdit", "apporter", "sac", "objets", "couteau", "bouteille", "verre", "drogue", "cigarette", "alcool"],
                a: `🚫 Objets interdits sur le site :\n\n• Extincteurs\n• Parapluies\n• Bouteilles en verre\n• Drones\n• Stickers et marqueurs\n\nLes gourdes vides (<1L), crèmes solaires et produits médicaux (avec ordonnance) sont autorisés. Fouilles à l'entrée — mieux vaut voyager léger !`
            },
            {
                k: ["manger", "boire", "food", "resto", "restaurant", "végétarien", "vegetarien", "vegan", "sans gluten", "eau", "bar"],
                a: `🍴 Plus de <b>40 stands food</b> t'attendent : burgers artisanaux, cuisine du monde, food trucks locaux, options végétariennes, véganes et sans gluten.\n\n• Deux zones de <b>distributeurs d'eau gratuits</b> (gourdes acceptées !)\n• Bars officiels : paiement sans contact ou cashless avec ta carte festivalier\n• 1 vente d'alcool par personne, sur présentation d'un ID (18+), une seule pièce d'identité acceptée par personne`
            },
            {
                k: ["programmation", "line-up", "lineup", "artiste", "concert", "scène", "scene", "affiche", "tête d'affiche", "tete d'affiche", "groupe", "dj", "programme"],
                a: `🎵 Le line-up complet est sur <em>solstice-festival.fr/programme</em> !\n\nQuelques noms attendus :\n• <b>Electro :</b> Nuit Sonore, Klova\n• <b>Rock :</b> Les Échos Sauvages, Marée Basse\n• <b>Hip-hop :</b> Sanka, Dua Kali\n• <b>Scène émergente :</b> découvertes régionales chaque jour à 13h\n\nLes 3 scènes alternent pour que tu ne rates rien, et l'appli officielle te permet de créer ton planning personnalisé.`
            },
            {
                k: ["bracelet", "cashless", "argent", "carte", "paiement", "recharge", "rembours", "actif", "distributeur", "wristband"],
                a: `💳 Ton bracelet festivalier, c'est ton portefeuille !\n\n• Rechargeable en ligne ou aux bornes sur site (CB, espèces)\n• <b>Cashless remboursable</b> : à 12 € en prévente ou 15 € sur place, remboursable à la sortie du festival\n• Solde remboursé en ligne jusqu'à 30 jours après le festival\n\nPerte ou vol ? Direction le point info avec ta pièce d'identité : on gèle et remplace ton bracelet.`
            },
            {
                k: ["sécurité", "securite", "premiers secours", "urgence", "secours", "perdu", "enfant", "foule", "malaise", "assistance"],
                a: `🛟 Ta sécurité d'abord :\n\n• <b>Poste de premiers secours</b> ouvert 24h/24 près de la Main Stage\n• Points <em>Safe Zone</em> : équipes formées si tu te sens mal ou pas en sécurité\n• Point <b>enfants perdus</b> à l'entrée principale\n• Numéro d'urgence du festival : <b>04 72 00 12 12</b>\n\nLes agents et bénévoles portent un t-shirt turquoise, n'hésite pas à les solliciter.`
            },
            {
                k: ["météo", "meteo", "pleuvoir", "pluie", "chaud", "soleil", "crème"],
                a: `🌦️ On danse par tous les temps !\n\n• Prévois de la crème solaire (autorisée) et un chapeau\n• Ponchos autorisés, parapluies interdits\n• Zones d'ombre et brumisateurs gratuits sur tout le site\n• En cas de forte pluie, les scènes couvertes continuent, et l'info est relayée en temps réel sur l'appli et les écrans`
            },
            {
                k: ["enfant", "mineur", "âge", "age", "famille", "accompagné"],
                a: `👨‍👩‍👧 Le festival est accessible dès <b>12 ans, accompagné d'un adulte</b>. L'entrée est gratuite pour les moins de 12 ans (billet enfant à retirer en ligne). La zone famille, avec espace jeux calme, se trouve près du lac.`
            },
            {
                k: ["handicapé", "handicape", "pmr", "accessibilité", "accessibilite", "fauteuil", "pmr"],
                a: `♿ Le site est pensé pour tous :\n\n• Chemins accessibles PMR et plateformes dédiées face aux scènes\n• Sanitaires accessibles et assistance à l'entrée\n• Accompagnateur bénévole possible sur demande à <em>access@solstice-festival.fr</em>`
            },
            {
                k: ["animal", "chien", "chat"],
                a: `🐾 Les animaux ne sont pas admis sur le site (ni au camping), sauf chiens-guides d'assistance. Pense à une pension : nos partenaires Animalov t'offrent −10 % avec le code SOLSTICE26.`
            },
            {
                k: ["annuler", "remboursement", "revendre", "revendeur", "nom", "changer"],
                a: `🔁 Billets non remboursables, mais <b>revente officielle</b> possible via la billetterie (ton nom est modifiable jusqu'à 48h avant le festival, en ligne, gratuitement). On déconseille fortement les revendeurs tiers : c'est la première cause de refoulement à l'entrée !`
            },
            {
                k: ["bonjour", "salut", "hello", "hey", "coucou", "yo", "wesh", "cc"],
                a: `Hey, heureux de te voir ! 🎉 Je suis l'assistant du ${FEST.nom}, ${FEST.dates} au ${FEST.lieu}. Programme, billets, accès, camping, food… pose-moi ta question !`
            },
            {
                k: ["merci", "top", "cool", "génial", "genial", "super"],
                a: `Avec plaisir ! 🎡 S'il te manque une info, n'hésite pas — et rendez-vous ${FEST.dates} sous le soleil de Lyon ! 🌞`
            }
        ];
        const FALLBACK = `Hmm, je n'ai pas encore la réponse à ça 😅 Essaie avec des mots-clés comme <em>billets</em>, <em>programmation</em>, <em>accès</em>, <em>camping</em>, <em>food</em> ou <em>sécurité</em>. Pour tout le reste, le point info est à l'entrée principale ou sur <em>solstice-festival.fr</em> !`;

        const CHIPS = ["🎟️ Billets & tarifs", "🎵 Programmation", "🚍 Accès & transport", "⛺ Camping", "🍴 Food & boissons", "🚫 Objets interdits"];

        const chat = document.getElementById("chat");
        const quick = document.getElementById("quick");
        const form = document.getElementById("form");
        const input = document.getElementById("input");
        const sleep = (ms) => new Promise(r => setTimeout(r, ms));
        const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");

        function addMsg(role, html) {
            const div = document.createElement("div");
            div.className = "msg " + role;
            const av = document.createElement("div");
            av.className = "avatar";
            av.textContent = role === "bot" ? "🎧" : "🙋";
            const b = document.createElement("div");
            b.className = "bubble";
            b.innerHTML = html;
            div.append(av, b);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            return b;
        }

        async function botReply(text) {
            // typing indicator
            const div = document.createElement("div");
            div.className = "msg bot";
            div.innerHTML = '<div class="avatar">🎧</div><div class="bubble"><div class="typing"><i></i><i></i><i></i></div></div>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            await sleep(650 + Math.random() * 500);
            div.remove();

            const t = norm(text);
            let best = null, bestScore = 0;
            for (const it of INTENTS) {
                const score = it.k.reduce((s, kw) => s + (t.includes(norm(kw)) ? kw.length : 0), 0);
                if (score > bestScore) { bestScore = score; best = it; }
            }
            addMsg("bot", best ? best.a : FALLBACK);
        }

        function send(text) {
            if (!text.trim()) return;
            addMsg("user", text.replace(/</g, "&lt;"));
            input.value = "";
            botReply(text);
        }

        form.addEventListener("submit", (e) => {
            e.preventDefault();
            send(input.value);
        });

        quick.innerHTML = "";
        CHIPS.forEach(c => {
            const b = document.createElement("button");
            b.className = "chip";
            b.type = "button";
            b.textContent = c;
            b.onclick = () => send(c);
            quick.appendChild(b);
        });

        (async () => {
            await sleep(400);
            addMsg("bot", `Salut et bienvenue au <b>${FEST.nom}</b> ! 🌞 Je suis ton assistant festivalier, dispo 24/7.\n\n${FEST.dates} · ${FEST.lieu} · ${FEST.horaires}.\n\nDemande-moi tout : programme, billets, accès, camping, food, sécurité… 🎶`);
        })();
    </script>
</body>

</html>
