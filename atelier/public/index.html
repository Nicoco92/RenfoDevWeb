<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cap Web — Festival de Musique</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <h1>Cap Web</h1>
    <p>Un assistant sur le Festival de Musique.</p>
    <form id="chat-form">
      <label for="message">Votre message</label>
      <textarea id="message" name="message" maxlength="200" rows="3"></textarea>
      <button type="submit">Envoyer</button>
    </form>
    <ul id="messages"></ul>
    <p id="status" role="status"></p>
  </main>
  <script src="./js/app.js"></script>
</body>
</html>
